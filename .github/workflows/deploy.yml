name: Deploy

# The site reads its releases from this repository's own Releases at build
# time, so it has to rebuild whenever a release appears or is edited — not only
# when someone pushes to the site itself. Editing a release body on GitHub is
# how a changelog gets corrected, and this is what makes that reach the page.

on:
  push:
    branches: [main]
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A release event's ref is the tag it was cut from, which is a fixed point
      # in the past — editing an old release would otherwise rebuild the site as
      # it stood then. The site is always the default branch; only the release
      # data it reads is allowed to be old.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The token is only here to raise the API rate limit — the releases it
      # reads are public. A build with no token still works and still deploys;
      # it just has fewer requests to spend.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Absent, the build simply ships no analytics and the site still deploys.
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          # The release this build exists to publish. GitHub answers its own
          # release list from a minute of cache, and this workflow starts within
          # seconds of the publish, so the list the build reads can easily be the
          # one from before — which is how 1.0.1 deployed, green, as 1.0.0. The
          # build waits for this tag to appear and fails if it never does.
          #
          # Only for a release that should now be in the list: a deleted or
          # unpublished one is supposed to be missing, and a draft was never
          # there. Every other trigger leaves this empty and builds at once.
          EXPECT_RELEASE_TAG: >-
            ${{ (github.event_name == 'release'
            && github.event.action != 'deleted'
            && github.event.action != 'unpublished'
            && github.event.release.draft == false)
            && github.event.release.tag_name || '' }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
